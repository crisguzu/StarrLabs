name: focused-verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install PostgreSQL 17 binaries
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-17
      - name: Synthetic ingestion-to-metric acceptance
        env:
          POSTGRES_BIN: /usr/lib/postgresql/17/bin
          STARRLABS_TEST_SCRATCH: /tmp
        run: python examples/data_product/demo.py
