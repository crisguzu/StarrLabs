<aside class="orientation-prompt" role="status" aria-live="polite">
  <span class="orientation-phone" aria-hidden="true"><span></span></span>
  <span class="orientation-copy">
    <strong>Rotate for companion mode</strong>
    <small>Turn your phone sideways for the fastest between-match view.</small>
  </span>
</aside>

<script>
  (() => {
    const prompt = document.querySelector('.orientation-prompt');
    const promptKey = 'starrlabs-orientation-hint-seen';
    const isPortraitPhone = matchMedia('(max-width: 760px) and (orientation: portrait)').matches;
    if (!prompt || !isPortraitPhone || sessionStorage.getItem(promptKey)) {
      if (prompt) prompt.hidden = true;
      return;
    }
    sessionStorage.setItem(promptKey, '1');
    window.setTimeout(() => {
      prompt.classList.add('is-dismissed');
      window.setTimeout(() => { prompt.hidden = true; }, 320);
    }, 4000);
  })();
</script>

<script>
  (() => {
    const key = `starrlabs-scroll:${location.pathname}${location.search}`;
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    const restore = () => {
      const saved = Number(sessionStorage.getItem(key));
      if (Number.isFinite(saved) && saved > 0) requestAnimationFrame(() => scrollTo(0, saved));
    };
    addEventListener('DOMContentLoaded', restore, { once: true });
    addEventListener('pageshow', restore);
    addEventListener('pagehide', () => sessionStorage.setItem(key, String(scrollY)));
  })();
</script>
